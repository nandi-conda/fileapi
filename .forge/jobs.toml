# CI for fileapi on its own forge (nandi.uk/fileapi). See "Deploy jobs" in README.md.
# Uses the secrets DEPOT_TOKEN + DEPOT_PROJECT_ID (user secrets) and FASTAPI_TOKEN (repo secret).

# Commits to GitHub's main come in by themselves: the server checks github.com/nandi-conda/fileapi every
# minute and fast-forwards the forge's main, which runs the deploy job below like any push. No token: the
# repo is public. So a commit to main deploys whether it was pushed here or to GitHub.
[upstream]
url = "https://github.com/nandi-conda/fileapi.git"
branches = ["main"]
interval = 60

# Pushes to main deploy to FastAPI Cloud from a Depot build: ci/Dockerfile.deploy runs ci/deploy.py on
# Depot's builders, with FASTAPI_TOKEN as a build secret. The build output (fastapi deploy's log) is
# this run's output, with the Depot build link.
[[job]]
name = "deploy"
branches = ["main"]
timeout = 1800
[job.depot]
file = "ci/Dockerfile.deploy"
save = false
# B2_KEY_ID/B2_BUCKET: where the server keeps big blobs (Backblaze B2). The key ID isn't secret; the application
# key is the B2_TOKEN user secret, which the server reads itself (it never passes through CI).
# B2_FREE: a new value makes the deployed server drop the Postgres copies of bytes verified in B2 once, then VACUUM
# (fileapi/blob_migrate.py free). Change it only to free again; it deletes data from the database.
build_args = { FORGE_SHA = "${FORGE_SHA}", FORGE_RUN = "${FORGE_URL}/forge/#${FORGE_REPO}/-/deploys/${FORGE_RUN_ID}", B2_KEY_ID = "00531018a18baa60000000004", B2_BUCKET = "fileapi", B2_FREE = "2026-11-06-v-ok" }
args = ["--secret", "id=FASTAPI_TOKEN,env=FASTAPI_TOKEN"]

# Backup to GitHub on every push (branches and tags), fast-forwards only. Skipped until the
# GITHUB_MIRROR_TOKEN secret exists (a fine-grained token with Contents: Read and write on the repo).
[[job]]
name = "github-mirror"
branches = ["*"]
tags = ["*"]
timeout = 900
[job.mirror]
url = "https://github.com/nandi-conda/fileapi.git"
token = "${GITHUB_MIRROR_TOKEN}"
