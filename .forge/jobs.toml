# CI for fileapi on its own forge (nandi.uk/fileapi). See "Deploy jobs" in README.md.
# Uses the secrets DEPOT_TOKEN + DEPOT_PROJECT_ID (user secrets) and FASTAPI_TOKEN (repo secret).

# Pushes to main deploy to FastAPI Cloud from a Depot build: ci/Dockerfile.deploy runs ci/deploy.py on
# Depot's builders, with FASTAPI_TOKEN as a build secret. The build output (fastapi deploy's log) is
# this run's output, with the Depot build link.
[[job]]
name = "deploy"
branches = ["main"]
timeout = 1800
[job.depot]
file = "ci/Dockerfile.deploy"
save = false
build_args = { FORGE_SHA = "${FORGE_SHA}", FORGE_RUN = "${FORGE_URL}/forge/#${FORGE_REPO}/-/deploys/${FORGE_RUN_ID}" }
args = ["--secret", "id=FASTAPI_TOKEN,env=FASTAPI_TOKEN"]

# Backup to GitHub on every push (branches and tags), fast-forwards only. Skipped until the
# GITHUB_MIRROR_TOKEN secret exists (a fine-grained token with Contents: Read and write on the repo).
[[job]]
name = "github-mirror"
branches = ["*"]
tags = ["*"]
timeout = 900
[job.mirror]
url = "https://github.com/nandi-conda/fileapi.git"
token = "${GITHUB_MIRROR_TOKEN}"
