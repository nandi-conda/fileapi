[project]
name = "fileapi"
version = "1.2.0"
description = "Central file store exposed over MCP and a REST API, built on FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi[standard]>=0.115",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fileapi = "fileapi.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "fileapi.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
