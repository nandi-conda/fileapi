[project]
name = "fileapi"
version = "1.4.0"
description = "Central file store exposed over MCP and a REST API, built on FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi[standard]>=0.115",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "dulwich>=1.2.20",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",
    "cryptography>=42",  # repo secrets (AES-GCM), fileapi/deploy.py
    # code navigation in the forge web UI (fileapi/codenav.py)
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-java>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fileapi = "fileapi.__main__:main"
git-credential-fileapi = "fileapi.git_credential:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "fileapi.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Local tooling is managed with pixi (https://pixi.sh): `pixi install`, then `just <recipe>`.
# Runtime deps stay in [project] above, which FastAPI Cloud builds from; pixi installs this
# package editable from PyPI, plus Node (for `npx neonctl`) from conda-forge.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.13.*"
nodejs = ">=20"
git-lfs = ">=3.4"

[tool.pixi.pypi-dependencies]
fileapi = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=8"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
