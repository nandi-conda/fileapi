# Deploy fileapi to FastAPI Cloud. Runs on Depot CI (depot.dev), started by the forge's "deploy" job
# (.forge/jobs.toml) after the forge has mirrored the pushed commit to GitHub. The forge copies the
# FASTAPI_TOKEN secret (a FastAPI Cloud deploy token) into Depot CI before each run.
name: Deploy to FastAPI Cloud

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (default: the branch tip)
        required: false
        default: ""
      forge_run:
        description: Link to the forge run that started this
        required: false
        default: ""

jobs:
  deploy:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 25
    env:
      FASTAPI_CLOUD_APP: fileapi          # the app's name on FastAPI Cloud; its ID is looked up from it
      FILEAPI_URL: https://fileapi.fastapicloud.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}
      - name: Install the FastAPI Cloud CLI
        run: |
          python3 -m venv /tmp/fastapi-cli
          /tmp/fastapi-cli/bin/pip install --quiet "fastapi-cli[standard]"
          /tmp/fastapi-cli/bin/fastapi --version
      - name: Deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_TOKEN }}
          FASTAPI_CLI: /tmp/fastapi-cli/bin/fastapi
          FORGE_RUN: ${{ inputs.forge_run }}
        run: python3 .depot/deploy.py
